name: reporting_bridge_flutter
description: Flutter workflow and default UI for Ultimate Report Builder Reporting Bridge.
publish_to: "none"
version: 1.0.2

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  reporting_bridge:
    path: ../reporting_bridge
  flutter_inappwebview: ">=6.1.5 <7.0.0"
  archive: ">=4.0.9 <5.0.0"
  crypto: ">=3.0.6 <4.0.0"
  file_picker: ">=11.0.1 <14.0.0"
  path_provider: ">=2.1.5 <3.0.0"
  printing: ">=5.14.2 <6.0.0"
  shared_preferences: ">=2.3.0 <3.0.0"
  pdfx: ">=2.11.0 <3.0.0"
  # Keep `flutter pub downgrade` from selecting platform 3.0.x, which still
  # references removed dart:io Platform.packageRoot under Dart 3.9 / Flutter 3.35.
  platform: ">=3.1.5 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: 26.3.4

flutter:
  uses-material-design: true
  assets:
    - assets/printing/thermal_printer_test.pdf
  plugin:
    platforms:
      android:
        package: com.ultimate.reportbuilder.reporting_bridge_flutter
        pluginClass: ReportingBridgeFlutterPlugin
