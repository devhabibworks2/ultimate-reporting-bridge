name: URB Controller Patch

on:
  pull_request:
    paths:
      - .github/workflows/urb-controller-patch.yml

permissions:
  contents: write

jobs:
  patch-controller:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply scoped controller and regression-test patch
        run: |
          python - <<'PY'
          from pathlib import Path

          controller_path = Path('packages/reporting_bridge_flutter/lib/src/flow/report_flow_controller_base.dart')
          controller = controller_path.read_text()
          old = """    _set(_value.copyWith(supportShare: ReportOperationStatus.running));
              try {
                final package = const ReportSupportPackageBuilder().build(
                  seedData: request.seedData,
                  template: _value.committedTemplate ?? _value.selectedTemplate,
          """
          new = """    _set(_value.copyWith(supportShare: ReportOperationStatus.running));
              try {
                final template = _value.committedTemplate ?? _value.selectedTemplate;
                if (template == null) {
                  throw const ReportFlowFailure(
                    code: ReportFlowFailureCode.developmentSupportFailed,
                    diagnostic: 'A selected template is required to create a URB package.',
                  );
                }
                final package = const ReportSupportPackageBuilder().build(
                  seedData: request.seedData,
                  template: template,
          """
          if old not in controller:
              raise SystemExit('controller patch anchor not found exactly once')
          if controller.count(old) != 1:
              raise SystemExit('controller patch anchor is ambiguous')
          controller_path.write_text(controller.replace(old, new, 1))

          test_path = Path('packages/reporting_bridge_flutter/test/flow/report_flow_controller_test.dart')
          test = test_path.read_text()
          old_test = """  test(
              'development support shares a ZIP through the injected platform',
              () async {
                final sharePlatform = _FakeSupportSharePlatform();
                final controller = createController(supportSharePlatform: sharePlatform);
                addTearDown(controller.dispose);

                await controller.initialize();
                await controller.shareDevelopmentSupportPackage();

                expect(sharePlatform.calls, 1);
                expect(sharePlatform.lastBytes, isNotEmpty);
                expect(sharePlatform.lastFilename, startsWith('urb_report_issue_'));
                expect(sharePlatform.lastFilename, endsWith('.zip'));
                expect(controller.value.supportShare, ReportOperationStatus.succeeded);
              },
            );
          """
          new_test = """  test(
              'development support shares a URB package through the injected platform',
              () async {
                final sharePlatform = _FakeSupportSharePlatform();
                final controller = createController(supportSharePlatform: sharePlatform);
                addTearDown(controller.dispose);

                await controller.initialize();
                await controller.shareDevelopmentSupportPackage();

                expect(sharePlatform.calls, 1);
                expect(sharePlatform.lastBytes, isNotEmpty);
                expect(sharePlatform.lastFilename, startsWith('urb_report_issue_'));
                expect(sharePlatform.lastFilename, endsWith('.urb'));
                expect(controller.value.supportShare, ReportOperationStatus.succeeded);
              },
            );

            test(
              'development support fails without a selected template and does not share',
              () async {
                final sharePlatform = _FakeSupportSharePlatform();
                final controller = createController(
                  templates: const <CachedTemplate>[],
                  supportSharePlatform: sharePlatform,
                );
                addTearDown(controller.dispose);

                await controller.initialize();

                await expectLater(
                  controller.shareDevelopmentSupportPackage(),
                  throwsA(
                    isA<ReportFlowFailure>().having(
                      (failure) => failure.code,
                      'code',
                      ReportFlowFailureCode.developmentSupportFailed,
                    ),
                  ),
                );
                expect(sharePlatform.calls, 0);
                expect(controller.value.supportShare, ReportOperationStatus.failed);
              },
            );
          """
          if old_test not in test:
              raise SystemExit('controller test patch anchor not found exactly once')
          if test.count(old_test) != 1:
              raise SystemExit('controller test patch anchor is ambiguous')
          test_path.write_text(test.replace(old_test, new_test, 1))
          PY
      - name: Format only touched Dart files
        working-directory: packages/reporting_bridge_flutter
        run: dart format lib/src/flow/report_flow_controller_base.dart test/flow/report_flow_controller_test.dart lib/src/support/report_support_package.dart test/support/report_support_package_test.dart
      - name: Install dependencies
        working-directory: packages/reporting_bridge_flutter
        run: flutter pub get
      - name: Run focused URB Bridge tests
        working-directory: packages/reporting_bridge_flutter
        run: flutter test test/support/report_support_package_test.dart test/flow/report_flow_controller_test.dart
      - name: Commit verified patch to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/reporting_bridge_flutter/lib/src/flow/report_flow_controller_base.dart \
                  packages/reporting_bridge_flutter/test/flow/report_flow_controller_test.dart \
                  packages/reporting_bridge_flutter/lib/src/support/report_support_package.dart \
                  packages/reporting_bridge_flutter/test/support/report_support_package_test.dart \
                  packages/reporting_bridge_flutter/pubspec.lock
          git commit -m 'feat(support): require template for urb support share'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
