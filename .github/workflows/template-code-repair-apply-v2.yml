name: Apply Template Code Repair V2

on:
  push:
    branches:
      - feat/template-code-persistence-20260902

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/template-code-persistence-20260902
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: packages/reporting_bridge
        run: dart pub get
      - name: Apply minimal GREEN implementation
        run: python3 .github/scripts/apply_template_code_repair.py
      - name: Format
        working-directory: packages/reporting_bridge
        run: dart format lib test
      - name: Focused GREEN verification
        working-directory: packages/reporting_bridge
        run: |
          dart test \
            test/bridge_template_code_hardening_test.dart \
            test/bridge_selected_template_code_test.dart \
            test/bridge_template_query_transport_test.dart
      - name: Analyze
        working-directory: packages/reporting_bridge
        run: dart analyze
      - name: Full Bridge package tests
        working-directory: packages/reporting_bridge
        run: dart test
      - name: Commit verified repair
        run: |
          set -euo pipefail
          git rm .github/workflows/template-code-repair-apply-v2.yml
          git rm .github/scripts/apply_template_code_repair.py
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add packages/reporting_bridge
          git commit -m "fix(bridge): harden durable template code identity"
          git push origin HEAD:feat/template-code-persistence-20260902
