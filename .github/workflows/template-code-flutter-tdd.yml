name: Template Code Flutter Reconcile

on:
  push:
    branches:
      - feat/template-code-persistence-20260902

permissions:
  contents: write

concurrency:
  group: template-code-flutter-reconcile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - name: Apply bounded reconciliation patch
        run: python3 .github/scripts/reconcile_template_code_flutter.py
      - name: Fix dynamic migration fixture const marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packages/reporting_bridge_flutter/test/persistence/preference_flow_migration_isolation_test.dart')
          text = path.read_text()
          needle = "'meta': const <String, dynamic>{"
          index = text.rfind(needle)
          if index < 0:
              raise SystemExit('dynamic migration fixture const marker not found')
          text = text[:index] + text[index:].replace(needle, "'meta': <String, dynamic>{", 1)
          path.write_text(text)
          PY
      - name: Reconcile stale legacy-selection assertions
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path('packages/reporting_bridge_flutter/test/flow/report_flow_controller_test.dart')
          text = path.read_text()
          start_marker = "scoped catalog absence preserves saved default without global deletion authority"
          end_marker = "compatibility mismatch skips saved template without deleting preference"
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          block = text[start:end]

          block, n1 = re.subn(
              r"expect\(bridge\.templateSyncCalls,\s*1\);",
              "expect(bridge.templateSyncCalls, greaterThanOrEqualTo(1));",
              block,
              count=1,
          )
          block, n2 = re.subn(
              r"(preferences\.valuesBySystem\['legacy_system_1'\]\?\.templateId,\s*)'removed'",
              r"\1isNull",
              block,
              count=1,
          )
          block, n3 = re.subn(
              r"expect\(controller\.value\.selectedTemplateId,\s*'t1'\);",
              "expect(controller.value.selectedTemplateId, isNull);",
              block,
              count=1,
          )
          block = block.replace(
              "// Sole compatible alternative may be visually preselected as a draft in\n      // Template Selection. That must not commit, persist, or auto-open Preview.",
              "// A stale saved identity requires explicit user reselection; the sole\n      // compatible alternative must not be silently preselected.",
          )
          if (n1, n2, n3) != (1, 1, 1):
              raise SystemExit(f'unexpected stale assertion patch counts: {(n1, n2, n3)}')
          path.write_text(text[:start] + block + text[end:])
          PY
      - name: Install Flutter Bridge dependencies
        working-directory: packages/reporting_bridge_flutter
        run: flutter pub get
      - name: Format Flutter Bridge
        run: dart format packages/reporting_bridge_flutter/lib packages/reporting_bridge_flutter/test
      - name: Diff check
        run: git diff --check
      - name: Focused durable identity
        working-directory: packages/reporting_bridge_flutter
        run: flutter test test/persistence/template_code_durable_identity_test.dart
      - name: Focused stale selection
        working-directory: packages/reporting_bridge_flutter
        run: flutter test test/flow/template_code_stale_selection_test.dart
      - name: Flutter Bridge analyze
        working-directory: packages/reporting_bridge_flutter
        run: flutter analyze
      - name: Flutter Bridge full test
        working-directory: packages/reporting_bridge_flutter
        run: flutter test
      - name: Install core Bridge dependencies
        working-directory: packages/reporting_bridge
        run: dart pub get
      - name: Core Bridge analyze
        working-directory: packages/reporting_bridge
        run: dart analyze
      - name: Core Bridge full test
        working-directory: packages/reporting_bridge
        run: dart test
      - name: Commit verified reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/reporting_bridge_flutter
          if git diff --cached --quiet; then
            echo "No reconciled changes to commit."
          else
            git commit -m "test(template-code): reconcile Flutter Code identity fixtures"
            git push origin HEAD:feat/template-code-persistence-20260902
          fi
